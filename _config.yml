title: CIRTA
description: >-
  CIRTA es una corporación chilena sin fines de lucro dedicada a la investigación,
  robótica y tecnología aplicada, con foco en reducir brechas educativas en ciencia
  y tecnología a través de proyectos como EduRobotics y Zorzal.
url: "https://www.cirta.cl"
lang: es
logo: /static/img/cirta_logo.png
social:
  name: CIRTA
  links:
    - https://www.instagram.com/cirtacorp/
    - https://www.linkedin.com/company/cirta-corp

# URL /exec del Apps Script de google-apps-script/Newsletter.gs.
# Mientras esté vacía, el formulario de newsletter no se muestra.
newsletter_endpoint: "https://script.google.com/macros/s/AKfycbyQi9EXzQx7O1N5_l_8Z6CwSnQ_KkUGqf7Haq90uZ-Qkf6xNXIE1mJHLROLIrEre1p5/exec"

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - Backend-Forms.md
  - google-apps-script
  - LICENSE
  - vendor/bundle
  - .bundle

defaults:
  - scope:
      path: ""
    values:
      image: /static/img/cirta_logo.png
