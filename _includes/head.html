<head>

    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{{ include.title }}</title>
    {% seo title=false %}

    {% assign lang = page.lang | default: "es" %}
    {% assign prefix = "" %}
    {% if lang != "es" %}{% assign prefix = "/" | append: lang %}{% endif %}
    {% assign basename = page.url | remove_first: prefix %}
    <link rel="alternate" hreflang="es" href="https://www.cirta.cl{{ basename }}">
    <link rel="alternate" hreflang="en" href="https://www.cirta.cl/en{{ basename }}">
    <link rel="alternate" hreflang="pt" href="https://www.cirta.cl/pt{{ basename }}">
    <link rel="alternate" hreflang="x-default" href="https://www.cirta.cl{{ basename }}">

    <!-- Bootstrap Core CSS -->
    <link href="/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">

    <!-- Theme CSS -->
    <link href="/static/css/clean-blog.min.css" rel="stylesheet">

    <!--Our CSS-->
    <link href="/static/css/baseline.css" rel="stylesheet">

    <!-- Custom Fonts -->
    <link href="/vendor/font-awesome/css/font-awesome.min.css" rel="stylesheet" type="text/css">
    <link href='https://fonts.googleapis.com/css?family=Inter:400,400italic,600,700' rel='stylesheet' type='text/css'>
    <link href='https://fonts.googleapis.com/css?family=Poppins:300,400,500,600,700,800' rel='stylesheet' type='text/css'>

    <link rel="icon" type="image/png" href="/favicon.png">

</head>
