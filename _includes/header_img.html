<!-- Encabezado de página: degradado con los morados de marca (--cirta-purple / --cirta-purple-dark de baseline.css) sobre la imagen. -->
<header class="intro-header {{ include.class }}" style="background-image: linear-gradient(135deg, rgba(164,117,234,0.6), rgba(124,77,217,0.7)), url('{{ include.image }}');">
    <div class="container">
        <div class="row">
            <div class="col-lg-8 col-lg-offset-2 col-md-10 col-md-offset-1">
                <div class="page-heading">
                    <h1>{{ include.title }}</h1>
                    <hr class="small">
                    <h2 class="subheading">{{ include.subtitle }}</h2>
                    <span class="meta">{{ include.meta }}</span>
                </div>
            </div>
        </div>
    </div>
</header>
